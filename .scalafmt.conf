version = "3.8.3"
align.preset = some
maxColumn = 120

# Scala 3 dialect — braceless-prefer policy for new code
# convertToNewSyntax: keyword syntax (if/while/for/match) already applied to 392 files (2026-06-18)
# removeOptionalBraces: enabled 2026-06-27 — applied per-subsystem (jsonrpc first, then network/, etc.)
# indent.defnSite = 2: deferred — triggers ~426-file reformat; needs dedicated per-subsystem pass
# newlines.topLevelStatementBlankLines: deferred — triggers ~341-file reformat; same gate
runner.dialect = scala3

# Note: RedundantParens is excluded because it incorrectly removes parentheses from
# Scala 3 type intersections in given declarations, e.g., (A & B), which are required
# to disambiguate them from multiple type parameters.
rewrite.rules = [AvoidInfix, RedundantBraces, SortModifiers]
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = true